<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    :root {
      --primary-blue: #0054a6;
      --hover-blue: #003a75;
      --bg-color: #f8f9fa;
      --card-bg: rgba(255, 255, 255, 0.92);
      --border-color: #e0e0e0;
      --text-color: #333333;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url('https://i.imgur.com/QqFIR3y.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid var(--primary-blue);
      border-radius: 8px;
      padding: 35px 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 22px;
      color: var(--primary-blue);
      font-size: 1.4rem;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #555;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="email"],
    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .btn-inline {
      white-space: nowrap;
      padding: 11px 18px;
      background-color: var(--primary-blue);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-inline:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .checkbox-group input[type="checkbox"] {
      margin-top: 3px;
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 0.84rem;
      color: #555;
      line-height: 1.4;
      cursor: pointer;
      margin-bottom: 0;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: var(--primary-blue);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 15px;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.88rem;
      display: none;
    }

    .status-msg.error {
      background-color: #fde8e8;
      color: #9b1c1c;
    }

    .status-msg.success {
      background-color: #def7ec;
      color: #03543f;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>Minecraft Login</h2>

      <!-- 1. Email Section -->
      <div class="form-group">
        <label for="emailInput">Student Email</label>
        <div class="input-row">
          <input type="email" id="emailInput" placeholder="username@student.edu.vn" oninput="onEmailChange()">
          <button id="sendBtn" class="btn-inline" onclick="sendOTP()">Send OTP</button>
        </div>
      </div>

      <!-- 2. OTP Section -->
      <div class="form-group">
        <label for="otpInput">Verification Code (4-Digits)</label>
        <input type="text" id="otpInput" maxlength="4" placeholder="e.g. 1234" oninput="validateForm()">
      </div>

      <!-- 3. Agreement Terms -->
      <div class="checkbox-group">
        <input type="checkbox" id="termsCheck" onchange="validateForm()">
        <label for="termsCheck">
          I agree to link my student email for whitelist approval and account status verification on the server.
        </label>
      </div>

      <!-- 4. Final Submit Button -->
      <button id="loginBtn" class="btn-submit" onclick="verifyAndLogin()" disabled>Verify & Login</button>

      <div id="statusBox" class="status-msg"></div>
    </div>
  </div>

  <script>



    const SERVER_URL = 'http://localhost:3000';
    let resendTimer = null;

    function showMessage(text, isError = false) {
      const box = document.getElementById('statusBox');
      box.textContent = text;
      box.className = 'status-msg ' + (isError ? 'error' : 'success');
      box.style.display = 'block';
    }

    function validateForm() {
      const email = document.getElementById('emailInput').value.trim();
      const otp = document.getElementById('otpInput').value.trim();
      const isChecked = document.getElementById('termsCheck').checked;

      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = !(email && otp.length === 4 && isChecked);
    }

    async function onEmailChange() {
      validateForm();
      const email = document.getElementById('emailInput').value.trim();
      if (!email.endsWith('@student.edu.vn')) return;

      try {
        const res = await fetch(`${SERVER_URL}/api/cooldown-status?email=${encodeURIComponent(email)}`);
        const data = await res.json();
        
        if (data.remainingSecs > 0) {
          startCooldown(data.remainingSecs);
        }
      } catch (err) {}
    }

    function startCooldown(seconds = 120) {
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;

      let remaining = seconds;
      sendBtn.textContent = `Wait (${remaining}s)`;

      clearInterval(resendTimer);
      resendTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(resendTimer);
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send OTP';
        } else {
          sendBtn.textContent = `Wait (${remaining}s)`;
        }
      }, 1000);
    }

    async function sendOTP() {
      const email = document.getElementById('emailInput').value.trim();
      if (!email) return showMessage('Please enter your student email.', true);

      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';

      try {
        const response = await fetch(`${SERVER_URL}/api/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (data.success) {
          showMessage(data.message, false);
          startCooldown(data.remainingSecs || 120);
        } else {
          showMessage(data.message, true);
          if (data.remainingSecs) {
            startCooldown(data.remainingSecs);
          } else {
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send OTP';
          }
        }
      } catch (err) {
        showMessage('Cannot connect to server!', true);
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send OTP';
      }
    }

    async function verifyAndLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const code = document.getElementById('otpInput').value.trim();
  const isChecked = document.getElementById('termsCheck').checked;

  if (!email) return showMessage('Please enter your email.', true);
  if (!code || code.length !== 4) return showMessage('Please enter the 4-digit OTP code.', true);
  if (!isChecked) return showMessage('You must agree to the terms.', true);

  const loginBtn = document.getElementById('loginBtn');
  loginBtn.disabled = true;
  loginBtn.textContent = 'Verifying...';

  try {
    const response = await fetch(`${SERVER_URL}/api/verify-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, code })
    });

    const data = await response.json();

    if (data.success) {
      // FIX: Use local 'email' variable instead of undefined 'data.email'
      sessionStorage.setItem('sessionToken', data.token);
      sessionStorage.setItem('userEmail', email);

      showMessage('Verification success! Redirecting to setup...', false);
      setTimeout(() => {
        window.location.href = `setup.html?email=${encodeURIComponent(email)}`;
      }, 800);
    } else {
      showMessage(data.message || 'Verification failed. Incorrect code.', true);
      loginBtn.disabled = false;
      loginBtn.textContent = 'Verify & Login';
    }
  } catch (err) {
    showMessage('Server error during verification.', true);
    loginBtn.disabled = false;
    loginBtn.textContent = 'Verify & Login';
  }
}
  </script>
</body>
</html>
